  <!-- ===== LIGHTBOX ===== -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="圖片放大檢視">
    <button class="lb-close" id="lb-close" aria-label="關閉">✕ <span>Close (Esc)</span></button>
    <img id="lb-img" src="" alt="" class="lb-image" />
    <p id="lb-caption" class="lb-caption"></p>
  </div>

  <script>
    // 點擊圖片放大，加入白色說明文字
    // 取得 Lightbox 相關元素
    const lightbox  = document.getElementById('lightbox');   // 整個放大檢視的容器
    const lbImg     = document.getElementById('lb-img');     // 放大後顯示的大圖
    const lbCaption = document.getElementById('lb-caption'); // 放大後下方的文字說明
    const lbClose   = document.getElementById('lb-close');   // 關閉按鈕

    // 針對每個縮圖 <figure> 加上點擊事件
    document.querySelectorAll('.thumb').forEach(fig => {
      fig.addEventListener('click', () => {
        // 點擊縮圖時，將 Lightbox 的圖片來源換成 data-src (完整版圖片)
        lbImg.src = fig.dataset.src;
        // 將圖片的 alt 屬性改成 data-caption (方便無障礙使用)
        lbImg.alt = fig.dataset.caption;
        // 將 Lightbox 下方文字改成 data-caption (這就是白色文字說明的來源)
        lbCaption.textContent = fig.dataset.caption;
        // 顯示 Lightbox
        lightbox.classList.add('active');
      });
    });

    // 關閉 Lightbox 的函式
    function closeLB() { 
      lightbox.classList.remove('active'); 
    }

    // 點擊關閉按鈕時關閉 Lightbox
    lbClose.addEventListener('click', closeLB);

    // 點擊 Lightbox 背景區域時關閉 (避免誤觸圖片本身)
    lightbox.addEventListener('click', e => { 
      if (e.target === lightbox) closeLB(); 
    });

    // 按下鍵盤 ESC 鍵時關閉 Lightbox
    document.addEventListener('keydown', e => { 
      if (e.key === 'Escape') closeLB(); 
    });

  </script>
</body>
</html>
